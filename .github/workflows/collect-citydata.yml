name: 조용필 공연일 도시데이터 전체 수집

# 11/27 14:00부터 11/29 23:00까지 끊기지 않고, 올림픽공원의 서울시 실시간 도시데이터 전체 항목을 2분 간격으로 모읍니다.
# 한 실행은 4~5시간짜리 구간 하나를 맡고, 끝나기 전에 다음 구간 실행을 스스로 요청해 이어 갑니다(한 번만 시작시키면 됨).
# 로이킴 때 이 저장소의 예약 실행은 예정보다 7~8시간 늦게 돌았습니다. 그래서 예약은 30분마다 걸어 두되,
# 이어달리기가 끊겼을 때 되살리는 역할만 합니다(다른 실행이 돌고 있으면 몇 초 만에 끝남).
# 같은 구간은 한 번에 하나만 수집하고, 뒤에 온 실행은 기다렸다가 앞 실행이 끝나면 이어받습니다.
on:
  schedule:
    - cron: "7,37 6-23 26 11 *"   # UTC. KST로 11/26 15:07부터(공연 전날: 예약이 실제로 몇 시간 늦게 도는지 미리 보려고)
    - cron: "7,37 * 27-29 11 *"   # UTC. KST로 11/30 08:37까지
  workflow_dispatch:
    inputs:
      action:
        description: "auto: 지금부터 수집(11/29 23시까지 스스로 이어 감) · arm: auto와 같음 · check: 한 번 조회 · test: 5분 시험"
        type: choice
        default: auto
        options:
          - auto
          - arm
          - check
          - test
          - survey   # 여러 장소의 지하철 실시간 승하차가 채워지는지 한 번씩 조회해 로그로 비교

permissions:
  contents: write
  actions: write  # 앞 구간 실행이 뒤 구간 실행을 요청할 때 필요

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      segment: ${{ steps.plan.outputs.segment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 할 일 정하기
        id: plan
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REQUEST: ${{ inputs.action }}
          GH_TOKEN: ${{ github.token }}   # 예약 실행이 다른 실행이 도는지 확인할 때 씀
          GH_REPO: ${{ github.repository }}
          TZ: Asia/Seoul
        run: python3 citydata/collect_citydata.py plan

  collect:
    needs: plan
    if: needs.plan.outputs.mode != 'idle'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: citydata-${{ needs.plan.outputs.mode }}-${{ needs.plan.outputs.segment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 수집
        env:
          SEOUL_POPULATION_API_KEY: ${{ secrets.SEOUL_POPULATION_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_REQUEST: ${{ inputs.action }}
          MODE: ${{ needs.plan.outputs.mode }}
          SEGMENT: ${{ needs.plan.outputs.segment }}
          FULL_DIR: ${{ runner.temp }}/citydata_full
          TZ: Asia/Seoul
        run: |
          case "$MODE" in
            check) python3 citydata/collect_citydata.py check ;;
            survey) python3 citydata/collect_citydata.py survey ;;
            test) python3 citydata/collect_citydata.py test --minutes 5 --push --full-dir "$FULL_DIR" ;;
            collect) python3 citydata/collect_citydata.py collect --segment "$SEGMENT" --push --full-dir "$FULL_DIR" ;;
            wait) python3 citydata/collect_citydata.py wait ;;
            *) echo "알 수 없는 할 일: $MODE"; exit 1 ;;
          esac
      - name: 원본 보관
        if: always() && (needs.plan.outputs.mode == 'collect' || needs.plan.outputs.mode == 'test')
        uses: actions/upload-artifact@v6
        with:
          name: citydata-${{ needs.plan.outputs.segment || 'test' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            citydata/data/
            ${{ runner.temp }}/citydata_full/
          if-no-files-found: warn
          retention-days: 90
